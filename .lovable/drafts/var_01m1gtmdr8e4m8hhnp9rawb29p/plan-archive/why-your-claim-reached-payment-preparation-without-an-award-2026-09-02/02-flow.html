<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .lbl { font-size: 14px; font-weight: 480; }
    .sm { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .bx { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .miss { stroke: hsl(var(--accent)); stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="hsl(var(--muted-foreground))"/>
    </marker>
    <marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="hsl(var(--accent))"/>
    </marker>
  </defs>

  <rect class="bx" x="10" y="40" width="110" height="46" rx="8"/>
  <text class="lbl" x="65" y="60" text-anchor="middle">Approved</text>
  <text class="sm" x="65" y="76" text-anchor="middle">bn_claim</text>

  <rect class="bx" x="160" y="40" width="130" height="46" rx="8"/>
  <text class="lbl" x="225" y="60" text-anchor="middle">Entitlement</text>
  <text class="sm" x="225" y="76" text-anchor="middle">21 rows</text>

  <rect class="bx" x="330" y="40" width="130" height="46" rx="8"/>
  <text class="lbl" x="395" y="60" text-anchor="middle">Payment prep</text>
  <text class="sm" x="395" y="76" text-anchor="middle">where you are</text>

  <rect class="bx" x="500" y="40" width="130" height="46" rx="8"/>
  <text class="lbl" x="565" y="60" text-anchor="middle">Schedule</text>
  <text class="sm" x="565" y="76" text-anchor="middle">0 rows</text>

  <line class="wire" x1="120" y1="63" x2="155" y2="63" marker-end="url(#a)"/>
  <line class="wire" x1="290" y1="63" x2="325" y2="63" marker-end="url(#a)"/>
  <line class="wire" x1="460" y1="63" x2="495" y2="63" marker-end="url(#a)"/>

  <rect x="160" y="180" width="300" height="52" rx="8" fill="none" stroke="hsl(var(--accent))" stroke-width="1"/>
  <text class="lbl" x="310" y="201" text-anchor="middle" style="fill: hsl(var(--accent))">bn_award — never written</text>
  <text class="sm" x="310" y="219" text-anchor="middle">only 3 seed rows exist</text>

  <path class="miss" d="M225 86 L225 178" marker-end="url(#b)"/>
  <path class="miss" d="M395 178 L395 90" marker-end="url(#b)"/>
  <text class="sm" x="470" y="140" text-anchor="start" style="paint-order: stroke; stroke: hsl(var(--background)); stroke-width: 4px">schedule needs award_id</text>

  <circle cx="24" cy="262" r="9" fill="hsl(var(--accent))"/>
  <text x="24" y="266" text-anchor="middle" font-size="11" style="fill: hsl(var(--accent-foreground))">1</text>
  <text class="sm" x="42" y="266">Orchestrator logs an AWARD_CREATED event but inserts only an entitlement — the award row is skipped.</text>
</svg>
