<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .lbl { font-size: 14px; font-weight: 480; }
    .sm { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .bx { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .pin { fill: hsl(var(--accent)); }
    .pinT { font-size: 12px; fill: hsl(var(--accent-foreground)); }
  </style>
  <defs>
    <marker id="ch" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="bx" x="8" y="40" width="108" height="46" rx="8"/>
  <text class="lbl" x="62" y="60" text-anchor="middle">Entitlement</text>
  <text class="sm" x="62" y="77" text-anchor="middle">22 live</text>

  <rect class="bx" x="140" y="40" width="108" height="46" rx="8"/>
  <text class="lbl" x="194" y="60" text-anchor="middle">Schedule</text>
  <text class="sm" x="194" y="77" text-anchor="middle">17 rows / 15 due</text>

  <rect class="bx" x="272" y="40" width="108" height="46" rx="8"/>
  <text class="lbl" x="326" y="60" text-anchor="middle">Payable</text>
  <text class="sm" x="326" y="77" text-anchor="middle">17 / 15 ready</text>

  <rect class="bx" x="404" y="40" width="108" height="46" rx="8"/>
  <text class="lbl" x="458" y="60" text-anchor="middle">Batch</text>
  <text class="sm" x="458" y="77" text-anchor="middle">9 / all OPEN</text>

  <rect class="bx" x="536" y="40" width="96" height="46" rx="8"/>
  <text class="lbl" x="584" y="60" text-anchor="middle">Issue</text>
  <text class="sm" x="584" y="77" text-anchor="middle">0 records</text>

  <line class="wire" x1="116" y1="63" x2="136" y2="63" marker-end="url(#ch)"/>
  <line class="wire" x1="248" y1="63" x2="268" y2="63" marker-end="url(#ch)"/>
  <line class="wire" x1="380" y1="63" x2="400" y2="63" marker-end="url(#ch)"/>
  <line class="wire" x1="512" y1="63" x2="532" y2="63" marker-end="url(#ch)"/>

  <circle class="pin" cx="326" cy="106" r="10"/>
  <text class="pinT" x="326" y="110" text-anchor="middle">1</text>
  <circle class="pin" cx="584" cy="106" r="10"/>
  <text class="pinT" x="584" y="110" text-anchor="middle">2</text>

  <rect class="zone" x="8" y="140" width="624" height="146" rx="8"/>
  <text class="sm" x="22" y="160">where it breaks</text>

  <circle class="pin" cx="34" cy="186" r="10"/>
  <text class="pinT" x="34" y="190" text-anchor="middle">1</text>
  <text class="sm" x="54" y="183">Payable has no claim number, period or beneficiary; the batch copies a field</text>
  <text class="sm" x="54" y="199">that does not exist, so every batch item fails validation with "Missing claim number".</text>
  <text class="sm" x="54" y="215">Result: no batch can be validated, approved or released.</text>

  <circle class="pin" cx="34" cy="248" r="10"/>
  <text class="pinT" x="34" y="252" text-anchor="middle">2</text>
  <text class="sm" x="54" y="245">The cheque write uses modern field names against the legacy cheque tables,</text>
  <text class="sm" x="54" y="261">and the post-issue back-link targets a column the payables table does not have.</text>
  <text class="sm" x="54" y="277">Result: every issue attempt would fail, and a success would leave no trace on the claim.</text>
</svg>
