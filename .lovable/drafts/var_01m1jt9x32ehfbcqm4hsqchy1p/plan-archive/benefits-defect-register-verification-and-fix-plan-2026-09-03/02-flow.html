<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .lbl { font-size: 14px; font-weight: 480; }
    .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .mono { font-family: var(--font-mono); font-size: 11px; fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .acc { fill: none; stroke: hsl(var(--accent)); stroke-width: 1; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="cv" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="zone" x="8" y="16" width="300" height="120" rx="8"/>
  <text class="note" x="18" y="34">import path (three dialogs)</text>

  <rect class="box" x="24" y="46" width="120" height="46" rx="8"/>
  <text class="lbl" x="84" y="66" text-anchor="middle">Catalogue rule</text>
  <text class="mono" x="84" y="82" text-anchor="middle">value_from · GREATER_OR_EQUAL</text>

  <line class="wire" x1="146" y1="69" x2="180" y2="69" marker-end="url(#cv)"/>
  <rect class="acc" x="182" y="46" width="112" height="46" rx="8"/>
  <text class="lbl" x="238" y="66" text-anchor="middle">shared mapper</text>
  <text class="mono" x="238" y="82" text-anchor="middle">+ field_key · registry check</text>
  <text class="note" x="24" y="118">unregistered fact ⇒ import refused</text>

  <line class="wire" x1="238" y1="94" x2="238" y2="160" marker-end="url(#cv)"/>

  <rect class="box" x="150" y="164" width="176" height="46" rx="8"/>
  <text class="lbl" x="238" y="184" text-anchor="middle">bn_eligibility_rule</text>
  <text class="mono" x="238" y="200" text-anchor="middle">fact_key + rule_definition.field_key</text>

  <line class="wire" x1="326" y1="187" x2="366" y2="187" marker-end="url(#cv)"/>
  <rect class="box" x="368" y="150" width="150" height="74" rx="8"/>
  <text class="lbl" x="443" y="176" text-anchor="middle">evaluator</text>
  <text class="note" x="443" y="194" text-anchor="middle">already fail-closed</text>
  <text class="mono" x="443" y="210" text-anchor="middle">PASS · FAIL · UNEVALUATED</text>

  <rect class="zone" x="352" y="16" width="276" height="120" rx="8"/>
  <text class="note" x="362" y="34">registries</text>
  <rect class="box" x="368" y="46" width="112" height="46" rx="8"/>
  <text class="lbl" x="424" y="66" text-anchor="middle">fieldRegistry</text>
  <text class="mono" x="424" y="82" text-anchor="middle">13 keys · authoritative</text>
  <line class="wire" x1="482" y1="69" x2="514" y2="69" marker-end="url(#cv)"/>
  <rect class="acc" x="516" y="46" width="100" height="46" rx="8"/>
  <text class="lbl" x="566" y="66" text-anchor="middle">registries/</text>
  <text class="mono" x="566" y="82" text-anchor="middle">re-export only</text>
  <text class="note" x="368" y="118">one list; builders can no longer offer dead keys</text>

  <circle cx="24" cy="252" r="9" fill="hsl(var(--accent))"/>
  <text x="24" y="256" text-anchor="middle" font-size="11" fill="hsl(var(--accent-foreground))">1</text>
  <text class="note" x="40" y="256">accent = what changes; everything else already behaves as drawn</text>
</svg>
