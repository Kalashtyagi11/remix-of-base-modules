<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .lbl { font-size: 14px; font-weight: 480; }
    .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .accentbox { fill: none; stroke: hsl(var(--accent)); stroke-width: 1; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .awire { stroke: hsl(var(--accent)); stroke-width: 1; fill: none; }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7" fill="none" stroke="hsl(var(--muted-foreground))"/>
    </marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7" fill="none" stroke="hsl(var(--accent))"/>
    </marker>
  </defs>

  <rect class="box" x="10" y="20" width="170" height="44" rx="8"/>
  <text class="lbl" x="95" y="40" text-anchor="middle">Workbench action runner</text>
  <text class="note" x="95" y="56" text-anchor="middle">APPROVE</text>

  <rect class="box" x="10" y="90" width="170" height="44" rx="8"/>
  <text class="lbl" x="95" y="110" text-anchor="middle">Approval Console</text>
  <text class="note" x="95" y="126" text-anchor="middle">approve</text>

  <rect class="accentbox" x="10" y="160" width="170" height="60" rx="8"/>
  <text class="lbl" x="95" y="182" text-anchor="middle">Next Step Guidance</text>
  <text class="note" x="95" y="198" text-anchor="middle">Approve button</text>
  <text class="note" x="95" y="212" text-anchor="middle">approveClaim()</text>

  <rect class="box" x="255" y="55" width="160" height="44" rx="8"/>
  <text class="lbl" x="335" y="75" text-anchor="middle">Precondition gate</text>
  <text class="note" x="335" y="91" text-anchor="middle">documents · eligibility</text>

  <rect class="box" x="480" y="105" width="150" height="60" rx="8"/>
  <text class="lbl" x="555" y="128" text-anchor="middle">APPROVED</text>
  <text class="note" x="555" y="144" text-anchor="middle">entitlement + payable</text>
  <text class="note" x="555" y="158" text-anchor="middle">→ payment</text>

  <path class="wire" d="M180 42 L255 70" marker-end="url(#a)"/>
  <path class="wire" d="M180 112 L255 88" marker-end="url(#a)"/>
  <path class="wire" d="M415 77 L480 120" marker-end="url(#a)"/>
  <path class="awire" d="M180 190 C 320 190, 360 175, 480 150" marker-end="url(#b)"/>
  <text class="note" x="330" y="238" text-anchor="middle" style="paint-order: stroke; stroke: hsl(var(--background)); stroke-width: 3px;">gate bypassed — this is the path the officer used</text>

  <circle cx="200" cy="270" r="9" fill="hsl(var(--accent))"/>
  <text x="200" y="274" text-anchor="middle" style="font-size:11px; fill: hsl(var(--accent-foreground));">1</text>
  <text class="note" x="218" y="274">Fix: route every approval entry point through the same gate.</text>
</svg>
